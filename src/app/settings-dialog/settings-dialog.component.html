<div class="controls-row">
  @if(true){
    <img class="header-icon" src="assets/icons/user.png" alt="User Icon" (click)="openPayOrBillingDialog()" />
  }
  <mat-form-field appearance="outline">
    <mat-select [(value)]="selectedLang" (selectionChange)="onLanguageChange($event.value)">
      @for (lang of languages; track lang.code) {
        <mat-option [value]="lang.code">{{ lang.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-slide-toggle class="green-toggle" [(ngModel)]="needSubtext" color="accent">
    {{ subtextLabel }}
  </mat-slide-toggle>

  <mat-slide-toggle class="green-toggle" [(ngModel)]="needAudio" color="accent">
    {{ audioLabel }}
  </mat-slide-toggle>

  <button mat-icon-button (click)="close()" class="icon-button">
    <img src="assets/icons/cancel-circle-button.png" alt="Cancel" width="40" height="40" />
  </button>

  <button mat-icon-button (click)="save()" class="icon-button">
    <img src="assets/icons/ok-circle-button.png" alt="Save" width="40" height="40" />
  </button>
</div>  
@if(isPayDialogOpen){
  <app-pricing-dialog
    [open]="isPayDialogOpen"
    [config]="{
      currency: '₪',
      monthly: 39,
      quarterly: 29,
      yearly: 20
    }"
    (planSelected)="confirmPayment($event)"
    (closed)="isPayDialogOpen = false">
  </app-pricing-dialog>
}
@if(isBillingDialogOpen){
  <app-billing-dialog
    [open]="isBillingDialogOpen"
    [meResponse]="meResponse"
    (closed)="isBillingDialogOpen = false">
  </app-billing-dialog>
}
