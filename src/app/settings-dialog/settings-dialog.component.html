<h4 mat-dialog-title>{{ titleLabel }}</h4>

<div mat-dialog-content style class="language-options">
  <mat-form-field appearance="outline">
    <mat-label>{{langLabel}}</mat-label>
    <mat-select [(value)]="selectedLang" (selectionChange)="onLanguageChange($event.value)">
      @for (lang of languages; track lang.code) {
        <mat-option [value]="lang.code">{{ lang.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  <mat-checkbox [(ngModel)]="needSubtext">{{subtextLabel}}</mat-checkbox>
  <mat-checkbox [(ngModel)]="needAudio">{{audioLabel}}</mat-checkbox>

</div>

<div mat-dialog-actions align="center">
  <button mat-button (click)="close()">{{ cancelLabel }}</button>
  <button mat-flat-button (click)="save()">{{ saveLabel }}</button>
</div>
