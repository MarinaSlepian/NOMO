
<div class="rectangle-row">
  @for (i of indexesArray; track i) {
    <div class="color-cell" [style.background]="colors[i]">
      {{ i + 1 }}
    </div>
  }
</div>

<div cdkDropList cdkDropListOrientation="horizontal" class="pictures-list" (cdkDropListDropped)="drop($event)">
  @for (path of pathsArray; track path) {
    <div class="picture-box" cdkDrag>
      <img [src]="path" alt="Image" style="max-width: 100%; max-height: 100%;">
    </div>
  }
</div>
