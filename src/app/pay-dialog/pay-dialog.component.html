@if (open) {
  <div class="backdrop" (click)="cancel()"></div>

  <div class="pay-dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <h3>{{ 'pay.title' | translate }}</h3>

    <p>
      {{ 'pay.desc' | translate:{ price: priceILS } }}
    </p>

    @if (payError) {
      <div class="error">{{ payError }}</div>
    }

    <div class="actions">
      <button (click)="confirm()" [disabled]="isPaying">
        {{ isPaying ? ('pay.processing' | translate) : ('pay.confirm' | translate) }}
      </button>

      <button (click)="cancel()" [disabled]="isPaying">
        {{ 'pay.cancel' | translate }}
      </button>
    </div>
  </div>
}
