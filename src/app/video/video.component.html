<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<div class="backdrop" (click)="onCancel()"></div>

<dialog open>
  <div class="video-container">
    <!-- Floating Buttons -->
    <button class="switch-button" type="button" (click)="onSwitchVideo(videoPlayer)">
      <img src="assets/icons/switch.png" alt="Switch Video" />
    </button>
    <button class="close-button" type="button" (click)="onCancel()">
      <img src="assets/icons/close.png" alt="Close" />
    </button>

    <!-- Video player -->
    <video #videoPlayer class="fullscreen-video" controls autoplay loop>
      <source [src]="videoPath" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </div>
</dialog>
