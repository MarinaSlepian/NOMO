<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<div class="backdrop" (click)="onCancel()"></div>

<dialog open>
  <div class="video-container">

    <video #videoPlayer class="fullscreen-video" autoplay loop playsinline preload="auto">
      <source [src]="videoPath" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <!-- ✅ Bottom custom controls -->
    <div class="custom-controls">
      <button (click)="togglePlay()">
        {{ isPlaying ? '⏸️ ' : '▶️ ' }}
      </button>
      <button (click)="onSwitchVideo()">
        🔄 
      </button>
    </div>

    <!-- ✅ Top-right Close button -->
    <!--<button class="close-control" (click)="onCancel()">
      <img src="assets/icons/close.png" alt="Close Video" width="24" height="24" />
    </button>-->
    <button class="close-control" (click)="onCancel()">
      ❎
    </button>

  </div>
</dialog>
