
<div class="backdrop" (click)="onCancel()"></div>
<dialog open>
   <!-- Video player -->
  <video #videoPlayer width="100%" height="auto" controls autoplay loop>
    <source [src]="videoPath" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <p class="actions">
    <button type="button" (click)="onCancel()">
      <img src="assets/icons/close.png" alt="Close" width="40" height="40" />
    </button>
    <button type="button" (click)="onSwitchVideo(videoPlayer)" class="icon-button">
      <img src="assets/icons/switch.png" alt="Switch Video" width="40" height="40"/>
    </button>
  </p>
</dialog>
