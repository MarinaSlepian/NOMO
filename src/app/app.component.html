<div *ngIf="showInstallButton" class="install-banner">
  <button class="install-button" (click)="installApp()">📲 Install NOMO</button>
</div>
@if (isPortraitOnMobile) {
    <div class="orientation-overlay">
        {{rotateInstruction}}
    </div>
  }


<div class="app-layout">

  <div class="top-bar">
    <app-header [appName]="currentConfig.selectedApp"></app-header>

    <app-dashboard
      class="dashboard-top-right"
      (selectNewApp)="onSelectAppButton($event)"
      (newConfig)="onUpdateNewConfig($event)">
    </app-dashboard>
  </div>

  <main class="main-content">
    <ul id="users">
      @for (b of buttons; track b.id) {
        <li>
          <app-button 
            [user]="b"
            [videoPath]="currentVideosPath"
            [currentApp]="currentConfig.selectedApp"
            [isSubtextNeeded]="isSubTextNeeded"
            [isAudioNeeded]="isAudioNeeded"  
          />
        </li>
      }
    </ul>  
  </main>

</div>
