<div class="dashboard-panel">
  <img src = "assets/logoNOMO.png" alt="NOMO" class="dashboard-image">
        <div class="buttons-column">
        <app-app-chooser [appName]="'APP_NAMES.WHAT_WRONG' | translate" 
        [id]="'1'" 
        [active]="currentConfig.selectedApp === '1'"
        (select)="selectApp($event)">
        </app-app-chooser>
        
        <app-app-chooser [appName]="'APP_NAMES.GOOD_BAD' | translate" 
        [id]="'2'" 
        [active]="currentConfig.selectedApp === '2'"
        (select)="selectApp($event)">
        </app-app-chooser>
        
        <app-app-chooser [appName]="'APP_NAMES.ACTIONS' | translate" 
        [id]="'3'" 
        [active]="currentConfig.selectedApp === '3'"
        (select)="selectApp($event)">
        </app-app-chooser>
        
        <app-app-chooser [appName]="'APP_NAMES.EMOTIONS' | translate" 
        [id]="'4'" 
        [active]="currentConfig.selectedApp === '4'"
        (select)="selectApp($event)">
        </app-app-chooser>
      </div>
      <div>
        <button class="icon-button" (click)="onSettingsButton()">
          <img src="assets/settings.png" alt="Settings" />
        </button>
      </div>

</div>
