
@if(currentSeqState === STATES.CHOOSER ){
<div class="color-grid-container">
  <div class="color-grid">
    <div class="color-cell color-green" (click)="onCellClick(2)">2</div>
    <div class="color-cell color-red" (click)="onCellClick(3)">3</div>
    <div class="color-cell color-blue" (click)="onCellClick(4)">4</div>
    <div class="color-cell color-yellow" (click)="onCellClick(5)">5</div>
  </div>
  <img class="character-illustration" src="assets/sequence-stuff/girl.png" alt="Character" />
</div>
}
@else if(currentSeqState === STATES.THUMBNAILS ){
    <app-sequence-thumbnails [numSegments]="numSegments"></app-sequence-thumbnails>
    
}
@else if(currentSeqState === STATES.SEQUENCE ){
    <div class="app-sequence">
    </div>
}
